server.port=8081

#connection vers le service d'enregistrement
eureka.client.service-url.defaultZone=http://bank-registry-service:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#connection a la base de donne mysql
# spring.datasource.url=jdbc:mysql://localhost:3306/bank_user_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
spring.datasource.url=jdbc:mysql://mysql-db:3306/bank_user_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Event Bus (si tu utilises RabbitMQ)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
rabbitmq.exchange=user.exchange
rabbitmq.routingkey=user.routingkey
rabbitmq.queue=user.queue